spring.application.name=intelliroute-explorer
server.port=${PORT:8080}

# Database Configuration (H2 standalone by default, MySQL supported via environment variables)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/intelliroute;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# API Keys & Integration Settings
tomtom.api.key=${TOMTOM_API_KEY:}
routing.osrm.url=https://router.project-osrm.org
weather.openmeteo.url=https://api.open-meteo.com/v1/forecast
geocoding.nominatim.url=https://nominatim.openstreetmap.org

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
